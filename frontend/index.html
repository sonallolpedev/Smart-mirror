<!DOCTYPE html>
<html>

<head>
    <title>Smart Mirror</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="mirror">
        <h1 id="time"></h1>
        <h2 id="date"></h2>
        <h3 id="weather">Detecting location...</h3>
        <div id="news"></div>


    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerHTML =
                now.toLocaleTimeString();
            document.getElementById("date").innerHTML =
                now.toDateString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function loadWeather() {
            document.getElementById("weather").innerHTML = "Pune | 29°C | Rainy";
        }
        loadWeather();

        document.getElementById("weather").innerHTML = "Pune | 28°C | Cloudy";

        async function loadData() {
            const res = await fetch("http://127.0.0.1:5000/data");
            const data = await res.json();

            document.getElementById("time").innerHTML = data.time;
            document.getElementById("date").innerHTML = data.date;
            document.getElementById("weather").innerHTML = data.city + " | " + data.temperature + "°C | " + data.condition;

            let newsHTML = "<h3>News</h3><ul>";
            data.news.forEach(n => {
                newsHTML += "<li>" + n + "</li>";
            });
            newsHTML += "</ul>";

            document.getElementById("news").innerHTML = newsHTML;
        }

        setInterval(loadData, 5000);
        loadData();
    </script>
</body>

</html>
